<!DOCTYPE html>
<html lang="zh" data-theme="aurora" data-appearance="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>codexU-web · 离线快照</title>
<style>:root {
  --radius: 14px;
  --gap: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.06);
  --font: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

/* ===== 主题（配色） ===== */
[data-theme="aurora"]  { --accent:#0ea5a4; --accent2:#3b82f6; --accent3:#8b5cf6; --accent4:#f59e0b; }
[data-theme="sunset"]  { --accent:#f97316; --accent2:#ec4899; --accent3:#ef4444; --accent4:#f59e0b; }
[data-theme="forest"]  { --accent:#16a34a; --accent2:#0d9488; --accent3:#65a30d; --accent4:#ca8a04; }
[data-theme="mono"]    { --accent:#3b82f6; --accent2:#6366f1; --accent3:#0ea5e9; --accent4:#8b5cf6; }
[data-theme="grape"]   { --accent:#8b5cf6; --accent2:#d946ef; --accent3:#6366f1; --accent4:#ec4899; }
[data-theme="ocean"]   { --accent:#06b6d4; --accent2:#3b82f6; --accent3:#14b8a6; --accent4:#0ea5e9; }

/* ===== 外观（深浅） ===== */
[data-appearance="light"] {
  --bg:#f4f6fb; --panel:#ffffff; --text:#1f2937; --muted:#6b7280;
  --border:#e5e7eb; --soft:#f1f5f9; --track:#eef2f7;
}
[data-appearance="dark"] {
  --bg:#0f172a; --panel:#1b2436; --text:#e5e7eb; --muted:#94a3b8;
  --border:#2b3650; --soft:#1e293b; --track:#243049;
}

* { box-sizing: border-box; }
body {
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; transition:background .3s, color .3s;
}

.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; background:var(--panel); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:10;
}
.brand { display:flex; align-items:center; gap:12px; }
.logo {
  width:40px; height:40px; border-radius:11px; display:grid; place-items:center;
  font-size:20px; color:#fff;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
}
.brand h1 { font-size:18px; margin:0; letter-spacing:.3px; }
.subtitle { margin:2px 0 0; font-size:12px; color:var(--muted); }

.controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.updated { font-size:12px; color:var(--muted); margin-right:6px; }

/* 额度预警条 */
.alert-bar {
  display:flex; align-items:center; gap:10px; padding:10px 22px; font-size:13px;
  border-bottom:1px solid var(--border);
}
.alert-bar.warn { background:#fef3c7; color:#92400e; }
.alert-bar.critical { background:#fee2e2; color:#991b1b; }
[data-appearance="dark"] .alert-bar.warn { background:#3a2e0f; color:#fcd34d; }
[data-appearance="dark"] .alert-bar.critical { background:#3f1212; color:#fca5a5; }
.alert-icon { font-size:15px; }
.alert-text b { font-weight:700; }

/* 今日概览 */
.today-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
@media (max-width:1000px){ .today-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:680px){ .today-grid{grid-template-columns:repeat(2,1fr);} }
.today-stat {
  background:var(--soft); border:1px solid var(--border); border-radius:12px;
  padding:12px 14px; min-width:0;
}
.today-stat .k { font-size:12px; color:var(--muted); }
.today-stat .v { font-size:22px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums; }
.today-stat .delta { font-size:12px; margin-top:3px; font-variant-numeric:tabular-nums; }
.delta.up { color:#dc2626; }
.delta.down { color:#16a34a; }
.delta.flat { color:var(--muted); }
[data-appearance="dark"] .delta.up { color:#f87171; }
[data-appearance="dark"] .delta.down { color:#4ade80; }
.btn, .select {
  border:1px solid var(--border); background:var(--soft); color:var(--text);
  border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer; font-family:inherit;
  transition:filter .15s, transform .05s;
}
.btn:hover, .select:hover { filter:brightness(1.05); }
.btn:active { transform:translateY(1px); }
.select { padding:7px 8px; }

.grid {
  display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--gap);
  padding:var(--gap); max-width:1340px; margin:0 auto;
}
.card {
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow); min-height:120px;
}
.span2 { grid-column:span 2; } .span3 { grid-column:span 3; }
@media (max-width:1000px){ .grid{grid-template-columns:repeat(2,1fr);} .span2,.span3{grid-column:span 2;} }
@media (max-width:680px){ .grid{grid-template-columns:1fr;} .span2,.span3{grid-column:span 1;} }

.card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.card-head h2 { font-size:14px; margin:0; font-weight:650; }
.tag { font-size:11px; color:var(--muted); background:var(--soft); border:1px solid var(--border); padding:2px 8px; border-radius:20px; }

/* 额度 */
.quota-wrap { display:flex; gap:26px; flex-wrap:wrap; }
.quota-item { text-align:center; }
.quota-item canvas { display:block; }
.quota-label { font-size:13px; font-weight:650; margin-top:6px; }
.quota-sub { font-size:11px; color:var(--muted); }
#quotaTag { color:var(--accent); }

/* Token 总览 */
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat { background:var(--soft); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.stat .k { font-size:11px; color:var(--muted); }
.stat .v { font-size:18px; font-weight:700; margin-top:2px; }
.wool { margin-top:12px; padding:12px; border-radius:10px; color:#fff;
  background:linear-gradient(120deg, var(--accent), var(--accent3)); }
.wool .k { font-size:12px; opacity:.9; }
.wool .v { font-size:22px; font-weight:800; }
.wool .cny { font-size:13px; opacity:.9; margin-left:8px; }

/* 领导力 */
.lead-wrap { display:flex; align-items:center; gap:16px; }
.lead-meta { flex:1; }
.lead-meta .tier { font-size:20px; font-weight:800; color:var(--accent); }
.lead-meta .score { font-size:12px; color:var(--muted); margin-bottom:8px; }
.subrow { display:flex; align-items:center; gap:8px; font-size:12px; margin:5px 0; }
.subrow .name { width:64px; color:var(--muted); }
.bar { flex:1; height:7px; background:var(--track); border-radius:6px; overflow:hidden; }
.bar > i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
.subrow .num { width:30px; text-align:right; font-variant-numeric:tabular-nums; }

/* 任务列表 */
.task-list { display:flex; flex-direction:column; gap:8px; max-height:260px; overflow:auto; }
.task {
  display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--border);
  border-radius:10px; background:var(--soft);
}
.task .dot { width:8px; height:8px; border-radius:50%; flex:none; }
.task .dot.codex { background:var(--accent); }
.task .dot.claude { background:var(--accent3); }
.task .body { flex:1; min-width:0; }
.task .t { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.task .m { font-size:11px; color:var(--muted); }
.task .tok { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.empty { color:var(--muted); font-size:13px; padding:8px 2px; }

/* 排行 */
.rank { display:flex; flex-direction:column; gap:8px; }
.rank .row { display:flex; align-items:center; gap:10px; font-size:13px; }
.rank .row .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rank .row .val { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.rank .row .mini { width:70px; height:6px; background:var(--track); border-radius:6px; overflow:hidden; }
.rank .row .mini > i { display:block; height:100%; background:var(--accent); }

.legend { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px; font-size:12px; color:var(--muted); }
.legend .li { display:flex; align-items:center; gap:6px; }
.legend .sw { width:10px; height:10px; border-radius:3px; }

canvas { width:100%; display:block; }
.foot { text-align:center; padding:18px; color:var(--muted); font-size:12px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">⚡</div>
      <div>
        <h1 id="appTitle">codexU-web</h1>
        <p class="subtitle" id="appSub">Codex / Claude 用量可视化 · 纯本地</p>
      </div>
    </div>
    <div class="controls">
      <span class="updated" id="updated">—</span>
      <button class="btn" id="btnRefresh" title="刷新 (Ctrl+U)">↻ <span data-i18n="refresh">刷新</span></button>
      <select id="themeSel" class="select" title="配色">
        <option value="aurora">Aurora</option>
        <option value="sunset">Sunset</option>
        <option value="forest">Forest</option>
        <option value="mono">Mono</option>
        <option value="grape">Grape</option>
        <option value="ocean">Ocean</option>
      </select>
      <button class="btn" id="btnAppearance" title="深浅色">🌓</button>
      <button class="btn" id="btnLang" title="语言">中/EN</button>
    </div>
  </header>

  <!-- 额度预警条：7天额度超80% 时显示 -->
  <div class="alert-bar" id="alertBar" hidden></div>

  <main class="grid">
    <!-- 今日概览（个人使用核心） -->
    <section class="card span3" id="cardToday">
      <div class="card-head"><h2 data-i18n="todayTitle">今日概览</h2><span class="tag" id="todayDate"></span></div>
      <div class="today-grid">
        <div class="today-stat">
          <div class="k" data-i18n="todayTokens">今日 Token</div>
          <div class="v" id="todayTokens">—</div>
          <div class="delta" id="todayTokensDelta"></div>
        </div>
        <div class="today-stat">
          <div class="k" data-i18n="todayValue">今日花费（等效价值）</div>
          <div class="v" id="todayValue">—</div>
          <div class="delta" id="todayValueDelta"></div>
        </div>
        <div class="today-stat">
          <div class="k" data-i18n="todayTasks">今日任务</div>
          <div class="v" id="todayTasksN">—</div>
          <div class="delta" id="todayProjectsN"></div>
        </div>
        <div class="today-stat">
          <div class="k" data-i18n="todayActive">活跃项目</div>
          <div class="v" id="todayProjects">—</div>
          <div class="delta" id="todayAvg"></div>
        </div>
      </div>
    </section>

    <!-- 额度 -->
    <section class="card span2" id="cardQuota">
      <div class="card-head"><h2 data-i18n="quota">额度窗口</h2><span class="tag" id="quotaTag"></span></div>
      <div class="quota-wrap" id="quotaWrap"></div>
    </section>

    <!-- Token 总览 -->
    <section class="card" id="cardTokens">
      <div class="card-head"><h2 data-i18n="tokens">Token 总览</h2></div>
      <div class="stat-grid" id="tokenStats"></div>
      <div class="wool" id="woolBox"></div>
    </section>

    <!-- AI 领导力 -->
    <section class="card" id="cardLead">
      <div class="card-head"><h2 data-i18n="leadership">AI 领导力</h2></div>
      <div class="lead-wrap">
        <canvas id="gauge" width="220" height="130"></canvas>
        <div class="lead-meta" id="leadMeta"></div>
      </div>
    </section>

    <!-- 今日任务 -->
    <section class="card span2" id="cardToday">
      <div class="card-head"><h2 data-i18n="todayTasks">今日任务</h2><span class="tag" id="todayCount"></span></div>
      <div class="task-list" id="todayList"></div>
    </section>

    <!-- 趋势 -->
    <section class="card span3" id="cardTrend">
      <div class="card-head"><h2 data-i18n="trend">Token 趋势（近 180 天）</h2></div>
      <div class="legend" id="trendLegend"></div>
      <canvas id="area" height="240"></canvas>
    </section>

    <!-- 热力图 -->
    <section class="card span3" id="cardHeat">
      <div class="card-head"><h2 data-i18n="heatmap">每日活跃热力图</h2></div>
      <canvas id="heat" height="160"></canvas>
    </section>

    <!-- 模型排行 -->
    <section class="card" id="cardModels">
      <div class="card-head"><h2 data-i18n="modelRank">模型排行</h2></div>
      <div class="rank" id="modelRank"></div>
    </section>

    <!-- 项目排行 -->
    <section class="card" id="cardProjects">
      <div class="card-head"><h2 data-i18n="projectRank">项目排行</h2></div>
      <div class="rank" id="projectRank"></div>
    </section>

    <!-- 近期任务 -->
    <section class="card span2" id="cardRecent">
      <div class="card-head"><h2 data-i18n="recentTasks">近期任务</h2></div>
      <div class="task-list" id="recentList"></div>
    </section>
  </main>

  <footer class="foot">
    <span data-i18n="privacy">所有数据均在本机解析，无任何上传。</span>
    <span id="footMeta"></span>
  </footer>

  
  

<script>'use strict';
// 纯 Canvas 自绘图表（无外部依赖，离线可用）。所有颜色由调用方传入以适配主题。
(function (global) {
  function setup(canvas, cssHeight) {
    const dpr = global.devicePixelRatio || 1;
    const w = canvas.clientWidth || canvas.parentNode.clientWidth || 600;
    const h = cssHeight || canvas.clientHeight || 200;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx, w, h };
  }

  function cssVar(name, fallback) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }

  // 环形进度
  function drawRing(canvas, percent, color) {
    const { ctx, w, h } = setup(canvas, 120);
    const cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 12;
    const pct = Math.max(0, Math.min(100, percent));
    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 11; ctx.lineCap = 'round';
    ctx.strokeStyle = cssVar('--track', '#eef2f7');
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    const start = -Math.PI / 2;
    ctx.strokeStyle = color;
    ctx.beginPath(); ctx.arc(cx, cy, r, start, start + (pct / 100) * Math.PI * 2); ctx.stroke();
    ctx.fillStyle = cssVar('--text', '#1f2937');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 22px ' + cssVar('--font', 'sans-serif');
    ctx.fillText(Math.round(pct) + '%', cx, cy - 4);
    ctx.fillStyle = cssVar('--muted', '#6b7280');
    ctx.font = '11px ' + cssVar('--font', 'sans-serif');
    ctx.fillText('used', cx, cy + 16);
  }

  // 半圆仪表
  function drawGauge(canvas, score, color) {
    const { ctx, w, h } = setup(canvas, 130);
    const cx = w / 2, cy = h - 14, r = Math.min(w / 2, h) - 16;
    const s = Math.max(0, Math.min(100, score));
    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 12; ctx.lineCap = 'round';
    ctx.strokeStyle = cssVar('--track', '#243049');
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 2 * Math.PI); ctx.stroke();
    ctx.strokeStyle = color;
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, Math.PI + (s / 100) * Math.PI); ctx.stroke();
    ctx.fillStyle = cssVar('--text', '#e5e7eb');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '800 28px ' + cssVar('--font', 'sans-serif');
    ctx.fillText(Math.round(s), cx, cy - 18);
    ctx.fillStyle = cssVar('--muted', '#94a3b8');
    ctx.font = '10px ' + cssVar('--font', 'sans-serif');
    ctx.fillText('0', cx - r + 6, cy + 12);
    ctx.fillText('100', cx + r - 12, cy + 12);
  }

  // 堆叠面积图
  function drawArea(canvas, dates, series, colors) {
    const { ctx, w, h } = setup(canvas, 240);
    ctx.clearRect(0, 0, w, h);
    const padL = 8, padR = 8, padT = 10, padB = 22;
    const cw = w - padL - padR, ch = h - padT - padB;
    const n = dates.length;
    if (!n) return;
    const totals = new Array(n).fill(0);
    series.forEach((s) => { for (let i = 0; i < n; i++) totals[i] += (s.data[i] || 0); });
    const max = Math.max(1, ...totals);
    const x = (i) => padL + (i / (n - 1)) * cw;
    const y = (v) => padT + ch - (v / max) * ch;
    // 堆叠
    const cum = new Array(n).fill(0);
    series.forEach((s, si) => {
      ctx.beginPath();
      for (let i = 0; i < n; i++) { const v = cum[i] + (s.data[i] || 0); const xx = x(i), yy = y(v); i ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); }
      for (let i = n - 1; i >= 0; i--) { const v = cum[i]; ctx.lineTo(x(i), y(v)); }
      ctx.closePath();
      const c = colors[si % colors.length];
      ctx.fillStyle = hexA(c, 0.78);
      ctx.fill();
      for (let i = 0; i < n; i++) cum[i] += (s.data[i] || 0);
    });
    // 月份网格
    ctx.fillStyle = cssVar('--muted', '#94a3b8');
    ctx.font = '10px ' + cssVar('--font', 'sans-serif'); ctx.textAlign = 'center';
    let lastM = '';
    for (let i = 0; i < n; i += Math.ceil(n / 8)) {
      const d = dates[i]; const m = d.slice(5);
      if (m !== lastM) { ctx.fillText(m, x(i), h - 6); lastM = m; }
    }
  }

  // 日历热力图（最近 ~26 周）
  function drawHeatmap(canvas, dailyArr) {
    const { ctx, w, h } = setup(canvas, 160);
    ctx.clearRect(0, 0, w, h);
    if (!dailyArr.length) return;
    const cell = Math.max(8, Math.min(16, Math.floor((w - 10) / 27)));
    const gap = 3;
    const max = Math.max(1, ...dailyArr.map((d) => d.v));
    dailyArr.forEach((d, i) => {
      const col = Math.floor(i / 7), row = i % 7;
      const px = 6 + col * (cell + gap), py = 6 + row * (cell + gap);
      const t = Math.log(1 + d.v) / Math.log(1 + max);
      ctx.fillStyle = t < 0.02 ? cssVar('--track', '#243049') : mixAccent(t);
      roundRect(ctx, px, py, cell, cell, 2); ctx.fill();
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function hexA(hex, a) {
    const c = hex.replace('#', '');
    const n = c.length === 3 ? c.split('').map((x) => x + x).join('') : c;
    const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }

  function mixAccent(t) {
    const a = cssVar('--accent', '#0ea5a4'), b = cssVar('--accent2', '#3b82f6');
    const pa = parse(a), pb = parse(b);
    const r = Math.round(pa[0] + (pb[0] - pa[0]) * t);
    const g = Math.round(pa[1] + (pb[1] - pa[1]) * t);
    const bl = Math.round(pa[2] + (pb[2] - pa[2]) * t);
    return `rgb(${r},${g},${bl})`;
  }
  function parse(hex) {
    const c = hex.replace('#', '');
    const n = c.length === 3 ? c.split('').map((x) => x + x).join('') : c;
    return [parseInt(n.slice(0, 2), 16), parseInt(n.slice(2, 4), 16), parseInt(n.slice(4, 6), 16)];
  }

  function fmt(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(n);
  }

  global.Charts = { drawRing, drawGauge, drawArea, drawHeatmap, fmt, cssVar };

8,"count":4,"usd":0.37},{"model":"\u003csynthetic>","tokens":0,"count":7,"usd":0}]}};</script>
<script>'use strict';
(function () {
  const I18N = {
    zh: {
      refresh: '刷新', quota: '额度窗口', tokens: 'Token 总览', leadership: 'AI 领导力',
      todayTasks: '今日任务', trend: 'Token 趋势（近 180 天）', heatmap: '每日活跃热力图',
      modelRank: '模型排行', projectRank: '项目排行', recentTasks: '近期任务',
      privacy: '所有数据均在本机解析，无任何上传。',
      total: '累计 Token', input: '输入', cached: '缓存命中', output: '输出',
      wool: '羊毛进度（API 等效价值）', noTask: '今日暂无活动任务',
      reset: '重置', tierOf: '评级', consistency: '一致性', scale: '规模', concurrency: '并发', breadth: '广度',
      sessions: '会话', updated: '更新于', estQuota: '（历史日志估算）', logPeak: '本机日志峰值',
      todayTitle: '今日概览', todayTokens: '今日 Token', todayValue: '今日花费（等效价值）',
      todayActive: '活跃项目', vsYest: '较昨日', noData: '无数据', avgPer: '每任务均值',
    },
    en: {
      refresh: 'Refresh', quota: 'Quota Windows', tokens: 'Token Overview', leadership: 'AI Leadership',
      todayTasks: "Today's Tasks", trend: 'Token Trend (180d)', heatmap: 'Daily Activity Heatmap',
      modelRank: 'Model Ranking', projectRank: 'Project Ranking', recentTasks: 'Recent Tasks',
      privacy: 'All data is parsed locally. Nothing is uploaded.',
      total: 'Total Tokens', input: 'Input', cached: 'Cache Hit', output: 'Output',
      wool: 'Wool Progress (API-equivalent value)', noTask: 'No active tasks today',
      reset: 'resets', tierOf: 'Tier', consistency: 'Consistency', scale: 'Scale', concurrency: 'Concurrency', breadth: 'Breadth',
      sessions: 'sessions', updated: 'Updated', estQuota: '(est. from logs)', logPeak: 'peak (local logs)',
      todayTitle: 'Today Overview', todayTokens: "Today's Tokens", todayValue: "Today's Cost (equiv.)",
      todayActive: 'Active Projects', vsYest: 'vs yesterday', noData: 'no data', avgPer: 'per task avg',
    },
  };
  let LANG = 'zh';
  const t = (k) => (I18N[LANG] && I18N[LANG][k]) || k;

  // ---------- 设置 ----------
  async function loadSettings() {
    try {
      const s = await fetch('/api/settings').then((r) => r.json());
      if (s && typeof s === 'object') {
        if (s.theme) document.documentElement.dataset.theme = s.theme;
        if (s.appearance) document.documentElement.dataset.appearance = s.appearance;
        if (s.lang) LANG = s.lang;
      }
    } catch (e) {}
    syncControls();
  }
  function syncControls() {
    document.getElementById('themeSel').value = document.documentElement.dataset.theme;
    document.getElementById('btnAppearance').textContent =
      document.documentElement.dataset.appearance === 'dark' ? '☀️' : '🌙';
    applyI18n();
  }
  function persist() {
    fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        theme: document.documentElement.dataset.theme,
        appearance: document.documentElement.dataset.appearance,
        lang: LANG,
      }),
    }).catch(() => {});
  }

  function applyI18n() {
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const k = el.getAttribute('data-i18n');
      el.textContent = t(k);
    });
    document.getElementById('appTitle').textContent = 'codexU-web';
    document.getElementById('appSub').textContent =
      LANG === 'zh' ? 'Codex / Claude 用量可视化 · 纯本地' : 'Codex / Claude usage · local-only';
  }

  // ---------- 颜色工具 ----------
  function getColors(n) {
    const v = (name, fb) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fb;
    const base = [v('--accent', '#0ea5a4'), v('--accent2', '#3b82f6'), v('--accent3', '#8b5cf6'), v('--accent4', '#f59e0b')];
    const out = base.slice();
    let i = 0;
    while (out.length < n) {
      const hue = (i * 47 + 200) % 360;
      out.push(`hsl(${hue},65%,58%)`);
      i++;
    }
    return out;
  }

  // ---------- 渲染 ----------
  function fmt(n) {
    if (n == null) return '0';
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(Math.round(n));
  }

  // 额度预警条：任一窗口用量超阈值时置顶提醒
  const ALERT_THRESHOLD = 80;
  function renderAlert(quota) {
    const bar = document.getElementById('alertBar');
    if (!quota.windows.length) { bar.hidden = true; return; }
    const worst = quota.windows.slice().sort((a, b) => (b.usedPercent || 0) - (a.usedPercent || 0))[0];
    const pct = worst.usedPercent || 0;
    if (pct < ALERT_THRESHOLD) { bar.hidden = true; return; }
    bar.hidden = false;
    const level = pct >= 95 ? 'critical' : 'warn';
    bar.className = 'alert-bar ' + level;
    bar.innerHTML =
      '<span class="alert-icon">⚠</span>' +
      '<span class="alert-text">' +
      (LANG === 'zh'
        ? `<b>${worst.label}</b> 已用 <b>${Math.round(pct)}%</b>，额度即将耗尽${pct >= 95 ? '，请留意！' : '，建议控制用量'}` +
          (worst.resetsAt && worst.resetsAt > Date.now() ? `（${t('reset')} ${new Date(worst.resetsAt).toLocaleString()}）` : '')
        : `<b>${worst.label}</b> at <b>${Math.round(pct)}%</b> — quota nearly exhausted` +
          (worst.resetsAt && worst.resetsAt > Date.now() ? ` (${t('reset')} ${new Date(worst.resetsAt).toLocaleString()})` : '')) +
      '</span>';
  }

  // 今日概览：今日 token / 花费 / 任务 / 项目，与昨日对比
  function renderToday(today) {
    if (!today) return;
    document.getElementById('todayDate').textContent = today.date;
    document.getElementById('todayTokens').textContent = fmt(today.tokens);
    document.getElementById('todayValue').textContent = '¥' + fmt(today.cny);
    document.getElementById('todayTasksN').textContent = today.tasks;
    document.getElementById('todayProjects').textContent = today.projects;

    const deltaTokens = document.getElementById('todayTokensDelta');
    const deltaValue = document.getElementById('todayValueDelta');
    const diffTokens = today.tokens - today.yesterdayTokens;
    const diffUsd = today.usd - today.yesterdayUsd;
    const diffPctT = today.yesterdayTokens > 0 ? (diffTokens / today.yesterdayTokens) * 100 : null;
    const diffPctU = today.yesterdayUsd > 0 ? (diffUsd / today.yesterdayUsd) * 100 : null;

    const arrow = (v) => (v > 0 ? '▲' : v < 0 ? '▼' : '—');
    const cls = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : 'flat');
    if (diffPctT == null) {
      deltaTokens.textContent = t('vsYest') + ' ' + t('noData');
      deltaTokens.className = 'delta flat';
    } else {
      deltaTokens.textContent = `${t('vsYest')} ${arrow(diffTokens)} ${Math.abs(diffPctT).toFixed(0)}%`;
      deltaTokens.className = 'delta ' + cls(diffTokens);
    }
    if (diffPctU == null) {
      deltaValue.textContent = t('vsYest') + ' ' + t('noData');
      deltaValue.className = 'delta flat';
    } else {
      deltaValue.textContent = `${t('vsYest')} ${arrow(diffUsd)} ${Math.abs(diffPctU).toFixed(0)}%`;
      deltaValue.className = 'delta ' + cls(diffUsd);
    }
    document.getElementById('todayProjectsN').textContent = today.tasks;
    document.getElementById('todayAvg').textContent =
      `${t('avgPer')} ${fmt(today.tasks ? today.tokens / today.tasks : 0)}`;
  }

  function renderQuota(quota) {
    const wrap = document.getElementById('quotaWrap');
    const tag = document.getElementById('quotaTag');
    wrap.innerHTML = '';
    if (!quota.windows.length) {
      tag.textContent = t('estQuota');
      wrap.innerHTML = '<div class="empty">' + (LANG === 'zh' ? '未在本机日志中找到额度记录' : 'No quota records found in local logs') + '</div>';
      return;
    }
    tag.textContent = t('logPeak');
    quota.windows.forEach((w) => {
      const pct = w.usedPercent == null ? 0 : w.usedPercent;
      const div = document.createElement('div');
      div.className = 'quota-item';
      const cv = document.createElement('canvas');
      cv.width = 110; cv.height = 110; cv.style.width = '110px'; cv.style.height = '110px';
      div.appendChild(cv);
      const label = document.createElement('div');
      label.className = 'quota-label';
      label.textContent = w.label;
      div.appendChild(label);
      if (w.resetsAt && w.resetsAt > Date.now()) {
        const sub = document.createElement('div');
        sub.className = 'quota-sub';
        sub.textContent = t('reset') + ' ' + new Date(w.resetsAt).toLocaleString();
        div.appendChild(sub);
      }
      if (w.limitName) {
        const sub2 = document.createElement('div');
        sub2.className = 'quota-sub';
        sub2.textContent = w.limitName;
        div.appendChild(sub2);
      }
      wrap.appendChild(div);
      Charts.drawRing(cv, pct, getColors(1)[0]);
    });
  }

  function renderTokens(tokens, value) {
    const stats = [
      [t('total'), fmt(tokens.total)],
      [t('input'), fmt(tokens.input)],
      [t('cached'), fmt(tokens.cached)],
      [t('output'), fmt(tokens.output)],
    ];
    document.getElementById('tokenStats').innerHTML = stats
      .map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`)
      .join('');
    document.getElementById('woolBox').innerHTML =
      `<div class="k">${t('wool')}</div><div class="v">$${fmt(value.usd)}<span class="cny">≈ ¥${fmt(value.cny)}</span></div>`;
  }

  function renderLeadership(lead) {
    const cv = document.getElementById('gauge');
    Charts.drawGauge(cv, lead.score, getColors(1)[0]);
    const subs = [
      [t('consistency'), lead.subscores.consistency],
      [t('scale'), lead.subscores.scale],
      [t('concurrency'), lead.subscores.concurrency],
      [t('breadth'), lead.subscores.breadth],
    ];
    const bars = subs
      .map(
        ([n, v]) =>
          `<div class="subrow"><span class="name">${n}</span><span class="bar"><i style="width:${v}%"></i></span><span class="num">${v}</span></div>`
      )
      .join('');
    document.getElementById('leadMeta').innerHTML =
      `<div class="tier">${lead.tier}</div><div class="score">${t('tierOf')} · ${lead.score}/100</div>${bars}`;
  }

  function taskRow(ta) {
    const div = document.createElement('div');
    div.className = 'task';
    const dot = document.createElement('span');
    dot.className = 'dot ' + ta.source;
    const body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = `<div class="t">${escapeHtml(ta.title)}</div><div class="m">${ta.model} · ${escapeHtml(ta.project || '')}</div>`;
    const tok = document.createElement('div');
    tok.className = 'tok';
    tok.textContent = fmt(ta.tokensUsed || ta.tokens || 0);
    div.append(dot, body, tok);
    return div;
  }

  function renderTasks(today, recent) {
    const tl = document.getElementById('todayList');
    document.getElementById('todayCount').textContent = today.length + ' ' + (LANG === 'zh' ? '项' : '');
    tl.innerHTML = '';
    if (!today.length) tl.innerHTML = '<div class="empty">' + t('noTask') + '</div>';
    else today.slice(0, 12).forEach((x) => tl.appendChild(taskRow(x)));

    const rl = document.getElementById('recentList');
    rl.innerHTML = '';
    if (!recent.length) rl.innerHTML = '<div class="empty">—</div>';
    else recent.slice(0, 16).forEach((x) => rl.appendChild(taskRow(x)));
  }

  function renderTrend(trends) {
    const names = trends.topModels.concat(['__other']);
    const colors = getColors(names.length);
    const series = names.map((m) => ({ name: m === '__other' ? (LANG === 'zh' ? '其他' : 'Other') : m, data: trends.modelSeries[m] || [] }));
    Charts.drawArea(document.getElementById('area'), trends.dates, series, colors);
    const leg = document.getElementById('trendLegend');
    leg.innerHTML = series
      .map((s, i) => `<span class="li"><span class="sw" style="background:${colors[i]}"></span>${escapeHtml(s.name)}</span>`)
      .join('');
  }

  function renderHeat(daily) {
    const arr = daily.map((d) => ({ date: d.date, v: d.tokens }));
    Charts.drawHeatmap(document.getElementById('heat'), arr);
  }

  function renderRank(rank, elId, valKey, fmtFn) {
    const el = document.getElementById(elId);
    const max = Math.max(1, ...rank.map((r) => r[valKey] || 0));
    el.innerHTML = rank
      .map(
        (r) =>
          `<div class="row"><span class="name">${escapeHtml(r.model || r.project)}</span>` +
          `<span class="mini"><i style="width:${((r[valKey] || 0) / max) * 100}%"></i></span>` +
          `<span class="val">${fmtFn(r)}</span></div>`
      )
      .join('');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  // ---------- 数据拉取 ----------
  async function refresh() {
    try {
      let d;
      if (window.__BOOTSTRAP__) {
        d = window.__BOOTSTRAP__;
        window.__BOOTSTRAP__ = null;
      } else {
        d = await fetch('/api/summary').then((r) => r.json());
      }
      renderAlert(d.quota);
      renderToday(d.today);
      renderQuota(d.quota);
      renderTokens(d.tokens, d.value);
      renderLeadership(d.leadership);
      renderTasks(d.tasks.today, d.tasks.recent);
      renderTrend(d.trends);
      renderHeat(d.trends.daily);
      renderRank(d.rankings.models, 'modelRank', 'tokens', (r) => fmt(r.tokens) + (r.usd ? ` · $${fmt(r.usd)}` : ''));
      renderRank(d.rankings.projects, 'projectRank', 'tokens', (r) => fmt(r.tokens) + ` · ${r.sessions}${LANG === 'zh' ? ' 会话' : ' ses'}`);
      document.getElementById('updated').textContent = t('updated') + ' ' + new Date(d.generatedAt).toLocaleTimeString();
      document.getElementById('footMeta').textContent =
        `${d.sources.codex.threadCount} Codex ${LANG === 'zh' ? '会话' : 'threads'} · ${d.sources.claude.fileCount} Claude ${LANG === 'zh' ? '文件' : 'files'}`;
    } catch (e) {
      document.getElementById('updated').textContent = 'error: ' + e.message;
    }
  }

  // ---------- 事件 ----------
  document.getElementById('btnRefresh').onclick = () => refresh();
  document.getElementById('themeSel').onchange = (e) => {
    document.documentElement.dataset.theme = e.target.value;
    persist();
    refresh();
  };
  document.getElementById('btnAppearance').onclick = () => {
    const cur = document.documentElement.dataset.appearance;
    document.documentElement.dataset.appearance = cur === 'dark' ? 'light' : 'dark';
    syncControls();
    persist();
    refresh();
  };
  document.getElementById('btnLang').onclick = () => {
    LANG = LANG === 'zh' ? 'en' : 'zh';
    syncControls();
    persist();
    refresh();
  };
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) {
      e.preventDefault();
      refresh();
    }
  });

  // ---------- 启动 ----------
  (async function init() {
    await loadSettings();
    syncControls();
    await refresh();
    setInterval(refresh, 60000);
  })();
})();
</script>
