<!DOCTYPE html>
<html lang="zh" data-theme="aurora" data-appearance="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>codexU-web · 离线快照</title>
<style>:root {
  --radius: 14px;
  --gap: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.06);
  --font: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

/* ===== 主题（配色） ===== */
[data-theme="aurora"]  { --accent:#0ea5a4; --accent2:#3b82f6; --accent3:#8b5cf6; --accent4:#f59e0b; }
[data-theme="sunset"]  { --accent:#f97316; --accent2:#ec4899; --accent3:#ef4444; --accent4:#f59e0b; }
[data-theme="forest"]  { --accent:#16a34a; --accent2:#0d9488; --accent3:#65a30d; --accent4:#ca8a04; }
[data-theme="mono"]    { --accent:#3b82f6; --accent2:#6366f1; --accent3:#0ea5e9; --accent4:#8b5cf6; }
[data-theme="grape"]   { --accent:#8b5cf6; --accent2:#d946ef; --accent3:#6366f1; --accent4:#ec4899; }
[data-theme="ocean"]   { --accent:#06b6d4; --accent2:#3b82f6; --accent3:#14b8a6; --accent4:#0ea5e9; }

/* ===== 外观（深浅） ===== */
[data-appearance="light"] {
  --bg:#f4f6fb; --panel:#ffffff; --text:#1f2937; --muted:#6b7280;
  --border:#e5e7eb; --soft:#f1f5f9; --track:#eef2f7;
}
[data-appearance="dark"] {
  --bg:#0f172a; --panel:#1b2436; --text:#e5e7eb; --muted:#94a3b8;
  --border:#2b3650; --soft:#1e293b; --track:#243049;
}

* { box-sizing: border-box; }
body {
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; transition:background .3s, color .3s;
}

.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 22px; background:var(--panel); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:10;
}
.brand { display:flex; align-items:center; gap:12px; }
.logo {
  width:40px; height:40px; border-radius:11px; display:grid; place-items:center;
  font-size:20px; color:#fff;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
}
.brand h1 { font-size:18px; margin:0; letter-spacing:.3px; }
.subtitle { margin:2px 0 0; font-size:12px; color:var(--muted); }

.controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.updated { font-size:12px; color:var(--muted); margin-right:6px; }

/* 额度预警条 */
.alert-bar {
  display:flex; align-items:center; gap:10px; padding:10px 22px; font-size:13px;
  border-bottom:1px solid var(--border);
}
.alert-bar.warn { background:#fef3c7; color:#92400e; }
.alert-bar.critical { background:#fee2e2; color:#991b1b; }
[data-appearance="dark"] .alert-bar.warn { background:#3a2e0f; color:#fcd34d; }
[data-appearance="dark"] .alert-bar.critical { background:#3f1212; color:#fca5a5; }
.alert-icon { font-size:15px; }
.alert-text b { font-weight:700; }

/* 今日概览 */
.today-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
@media (max-width:1000px){ .today-grid{grid-template-columns:repeat(2,1fr);} }
@media (max-width:680px){ .today-grid{grid-template-columns:repeat(2,1fr);} }
.today-stat {
  background:var(--soft); border:1px solid var(--border); border-radius:12px;
  padding:12px 14px; min-width:0;
}
.today-stat .k { font-size:12px; color:var(--muted); }
.today-stat .v { font-size:22px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums; }
.today-stat .delta { font-size:12px; margin-top:3px; font-variant-numeric:tabular-nums; }
.delta.up { color:#dc2626; }
.delta.down { color:#16a34a; }
.delta.flat { color:var(--muted); }
[data-appearance="dark"] .delta.up { color:#f87171; }
[data-appearance="dark"] .delta.down { color:#4ade80; }
.btn, .select {
  border:1px solid var(--border); background:var(--soft); color:var(--text);
  border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer; font-family:inherit;
  transition:filter .15s, transform .05s;
}
.btn:hover, .select:hover { filter:brightness(1.05); }
.btn:active { transform:translateY(1px); }
.select { padding:7px 8px; }

.grid {
  display:grid; grid-template-columns:repeat(3, 1fr); gap:var(--gap);
  padding:var(--gap); max-width:1340px; margin:0 auto;
}
.card {
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow); min-height:120px;
}
.span2 { grid-column:span 2; } .span3 { grid-column:span 3; }
@media (max-width:1000px){ .grid{grid-template-columns:repeat(2,1fr);} .span2,.span3{grid-column:span 2;} }
@media (max-width:680px){ .grid{grid-template-columns:1fr;} .span2,.span3{grid-column:span 1;} }

.card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.card-head h2 { font-size:14px; margin:0; font-weight:650; }
.tag { font-size:11px; color:var(--muted); background:var(--soft); border:1px solid var(--border); padding:2px 8px; border-radius:20px; }

/* 额度 */
.quota-wrap { display:flex; gap:26px; flex-wrap:wrap; }
.quota-item { text-align:center; }
.quota-item canvas { display:block; }
.quota-label { font-size:13px; font-weight:650; margin-top:6px; }
.quota-sub { font-size:11px; color:var(--muted); }
#quotaTag { color:var(--accent); }

/* Token 总览 */
.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat { background:var(--soft); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
.stat .k { font-size:11px; color:var(--muted); }
.stat .v { font-size:18px; font-weight:700; margin-top:2px; }
.wool { margin-top:12px; padding:12px; border-radius:10px; color:#fff;
  background:linear-gradient(120deg, var(--accent), var(--accent3)); }
.wool .k { font-size:12px; opacity:.9; }
.wool .v { font-size:22px; font-weight:800; }
.wool .cny { font-size:13px; opacity:.9; margin-left:8px; }

/* 领导力 */
.lead-wrap { display:flex; align-items:center; gap:16px; }
.lead-meta { flex:1; }
.lead-meta .tier { font-size:20px; font-weight:800; color:var(--accent); }
.lead-meta .score { font-size:12px; color:var(--muted); margin-bottom:8px; }
.subrow { display:flex; align-items:center; gap:8px; font-size:12px; margin:5px 0; }
.subrow .name { width:64px; color:var(--muted); }
.bar { flex:1; height:7px; background:var(--track); border-radius:6px; overflow:hidden; }
.bar > i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
.subrow .num { width:30px; text-align:right; font-variant-numeric:tabular-nums; }

/* 任务列表 */
.task-list { display:flex; flex-direction:column; gap:8px; max-height:260px; overflow:auto; }
.task {
  display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--border);
  border-radius:10px; background:var(--soft);
}
.task .dot { width:8px; height:8px; border-radius:50%; flex:none; }
.task .dot.codex { background:var(--accent); }
.task .dot.claude { background:var(--accent3); }
.task .body { flex:1; min-width:0; }
.task .t { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.task .m { font-size:11px; color:var(--muted); }
.task .tok { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.empty { color:var(--muted); font-size:13px; padding:8px 2px; }

/* 排行 */
.rank { display:flex; flex-direction:column; gap:8px; }
.rank .row {
  display:flex; flex-direction:column; gap:6px; font-size:13px;
  padding:9px 11px; background:var(--soft); border:1px solid var(--border); border-radius:10px;
}
.rank .row-top { display:flex; align-items:center; gap:8px; min-width:0; }
.rank .row .idx {
  flex:none; width:18px; height:18px; border-radius:6px; display:grid; place-items:center;
  font-size:11px; font-weight:700; color:var(--muted); background:var(--track);
}
.rank .row:first-child .idx { color:#fff; background:linear-gradient(135deg, var(--accent), var(--accent2)); }
.rank .row .name { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.rank .row .val { flex:none; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.rank .row .mini { display:block; height:6px; background:var(--track); border-radius:6px; overflow:hidden; }
.rank .row .mini > i {
  display:block; height:100%; min-width:0; border-radius:6px;
  background:linear-gradient(90deg, var(--accent), var(--accent2));
}

/* 图表悬停提示 */
.chart-tip {
  position:fixed; z-index:100; pointer-events:none; display:none;
  background:var(--panel); color:var(--text); border:1px solid var(--border);
  border-radius:10px; box-shadow:var(--shadow); padding:8px 10px;
  font-size:12px; min-width:120px; max-width:260px;
}
.chart-tip .tip-title { font-weight:700; margin-bottom:4px; }
.chart-tip .tip-row { display:flex; align-items:center; gap:6px; margin:2px 0; }
.chart-tip .tip-row .sw { width:8px; height:8px; border-radius:2px; flex:none; }
.chart-tip .tip-name { flex:1; min-width:0; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chart-tip .tip-val { flex:none; font-variant-numeric:tabular-nums; font-weight:600; }
.chart-tip .tip-row.total { border-top:1px solid var(--border); margin-top:5px; padding-top:5px; }

.legend { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px; font-size:12px; color:var(--muted); }
.legend .li { display:flex; align-items:center; gap:6px; }
.legend .sw { width:10px; height:10px; border-radius:3px; }

canvas { display:block; }
#area, #heat, #clock { width:100%; }
.foot { text-align:center; padding:18px; color:var(--muted); font-size:12px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }

/* ===== 成就 · 连击 ===== */
.ach-wrap { display:flex; gap:18px; align-items:stretch; }
@media (max-width:680px){ .ach-wrap{flex-direction:column;} }
.streak-box {
  flex:none; width:118px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:12px 8px; border-radius:12px;
  background:var(--soft); border:1px solid var(--border);
}
.flame { font-size:40px; line-height:1; filter:grayscale(.6) opacity(.5); }
.flame.lvl1 { filter:none; animation:flicker 2.2s ease-in-out infinite; }
.flame.lvl2 { filter:none; font-size:46px; animation:flicker 1.4s ease-in-out infinite; }
.flame.lvl3 { filter:none; font-size:52px; animation:flicker .9s ease-in-out infinite; text-shadow:0 0 18px rgba(249,115,22,.55); }
.flame.dim { opacity:.55; }
@keyframes flicker {
  0%,100% { transform:scale(1) rotate(-2deg); }
  50% { transform:scale(1.12) rotate(2deg); }
}
.flame-meta { text-align:center; }
.flame-n { font-size:24px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
.flame-cap { font-size:11px; color:var(--muted); margin-top:2px; }
.badge-grid { flex:1; display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px; align-content:start; }
.badge {
  display:flex; flex-direction:column; align-items:center; gap:3px; text-align:center;
  padding:9px 6px; border-radius:10px; border:1px solid var(--border); background:var(--soft);
  transition:transform .15s;
}
.badge:hover { transform:translateY(-2px); }
.badge .b-icon { font-size:20px; }
.badge .b-name { font-size:11px; font-weight:600; line-height:1.2; }
.badge .b-prog { font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; }
.badge.off { opacity:.45; }
.badge.off .b-icon { filter:grayscale(1); }
.badge.on .b-prog { color:var(--accent); font-weight:700; }
.badge.pop { animation:badgePop .6s ease; }
@keyframes badgePop { 0%{transform:scale(1);} 40%{transform:scale(1.18);} 100%{transform:scale(1);} }

/* 成就解锁 toast + 彩带 */
.ach-toast {
  position:fixed; right:20px; bottom:24px; z-index:200;
  display:flex; gap:12px; align-items:center;
  background:var(--panel); border:1px solid var(--accent); border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,.22); padding:14px 18px;
  opacity:0; transform:translateY(24px); transition:all .35s cubic-bezier(.2,.9,.3,1.2);
}
.ach-toast.show { opacity:1; transform:translateY(0); }
.ach-toast .a-icon { font-size:30px; }
.ach-toast .a-k { font-size:11px; color:var(--accent); font-weight:700; letter-spacing:1px; }
.ach-toast .a-name { font-size:15px; font-weight:800; }
.ach-toast .a-desc { font-size:11px; color:var(--muted); }
.confetti { position:fixed; inset:0; pointer-events:none; z-index:210; overflow:hidden; }
.confetti i {
  position:absolute; top:-12px; width:9px; height:14px; border-radius:2px;
  animation:confettiFall 2.4s ease-in forwards;
}
@keyframes confettiFall {
  0% { transform:translateY(0) translateX(0) rotate(0); opacity:1; }
  100% { transform:translateY(88vh) translateX(var(--dx)) rotate(var(--rot)); opacity:0; }
}

/* AI 生物钟 */
.clock-type { margin-top:8px; font-size:13px; font-weight:700; color:var(--accent); text-align:center; }
.clock-peak { font-size:11px; color:var(--muted); text-align:center; margin-top:2px; }

/* AI 战报 */
.weekly-preview { text-align:center; padding:6px 0 12px; }
.wk-tok { font-size:30px; font-weight:800; font-variant-numeric:tabular-nums;
  background:linear-gradient(120deg, var(--accent), var(--accent3));
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.wk-cap { font-size:13px; font-weight:700; margin-top:2px; }
.wk-sub { font-size:11px; color:var(--muted); margin-top:2px; }
.btn.wide { width:100%; }

/* 海报弹窗 */
.poster-modal {
  position:fixed; inset:0; z-index:150; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.62); backdrop-filter:blur(4px); padding:24px;
}
.poster-modal[hidden] { display:none; }
.poster-box { display:flex; flex-direction:column; gap:14px; align-items:center; max-height:100%; }
.poster-box canvas { max-height:calc(100vh - 130px); width:auto; max-width:min(88vw, 460px); border-radius:14px; box-shadow:0 16px 60px rgba(0,0,0,.5); }
.poster-actions { display:flex; gap:10px; }

/* 燃烧倒计时 */
.burn-line { font-size:11px; color:var(--muted); margin-top:4px; font-variant-numeric:tabular-nums; }
.burn-line.hot { color:#dc2626; font-weight:700; }
[data-appearance="dark"] .burn-line.hot { color:#f87171; }
.burn-line.dim { opacity:.7; font-style:italic; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">⚡</div>
      <div>
        <h1 id="appTitle">codexU-web</h1>
        <p class="subtitle" id="appSub">Codex / Claude 用量可视化 · 纯本地</p>
      </div>
    </div>
    <div class="controls">
      <span class="updated" id="updated">—</span>
      <button class="btn" id="btnRefresh" title="刷新 (Ctrl+U)">↻ <span data-i18n="refresh">刷新</span></button>
      <select id="themeSel" class="select" title="配色">
        <option value="aurora">Aurora</option>
        <option value="sunset">Sunset</option>
        <option value="forest">Forest</option>
        <option value="mono">Mono</option>
        <option value="grape">Grape</option>
        <option value="ocean">Ocean</option>
      </select>
      <button class="btn" id="btnAppearance" title="深浅色">🌓</button>
      <button class="btn" id="btnLang" title="语言">中/EN</button>
    </div>
  </header>

  <!-- 额度预警条：7天额度超80% 时显示 -->
  <div class="alert-bar" id="alertBar" hidden></div>

  <main class="grid">
    <!-- 今日概览（个人使用核心） -->
    <section class="card span3" id="cardToday">
      <div class="card-head"><h2 data-i18n="todayTitle">今日概览</h2><span class="tag" id="todayDate"></span></div>
      <div class="today-grid">
        <div class="today-stat">
          <div class="k" data-i18n="todayTokens">今日 Token</div>
          <div class="v" id="todayTokens">—</div>
          <div class="delta" id="todayTokensDelta"></div>
        </div>
        <div class="today-stat">
          <div class="k" data-i18n="todayValue">今日花费（等效价值）</div>
          <div class="v" id="todayValue">—</div>
          <div class="delta" id="todayValueDelta"></div>
        </div>
        <div class="today-stat">
          <div class="k" data-i18n="todayTasks">今日任务</div>
          <div class="v" id="todayTasksN">—</div>
          <div class="delta" id="todayProjectsN"></div>
        </div>
        <div class="today-stat">
          <div class="k" data-i18n="todayActive">活跃项目</div>
          <div class="v" id="todayProjects">—</div>
          <div class="delta" id="todayAvg"></div>
        </div>
      </div>
    </section>

    <!-- 额度 -->
    <section class="card span2" id="cardQuota">
      <div class="card-head"><h2 data-i18n="quota">额度窗口</h2><span class="tag" id="quotaTag"></span></div>
      <div class="quota-wrap" id="quotaWrap"></div>
    </section>

    <!-- Token 总览 -->
    <section class="card" id="cardTokens">
      <div class="card-head"><h2 data-i18n="tokens">Token 总览</h2></div>
      <div class="stat-grid" id="tokenStats"></div>
      <div class="wool" id="woolBox"></div>
    </section>

    <!-- AI 领导力 -->
    <section class="card" id="cardLead">
      <div class="card-head"><h2 data-i18n="leadership">AI 领导力</h2></div>
      <div class="lead-wrap">
        <canvas id="gauge" width="220" height="130" style="width:220px"></canvas>
        <div class="lead-meta" id="leadMeta"></div>
      </div>
    </section>

    <!-- 今日任务 -->
    <section class="card span2" id="cardTodayTasks">
      <div class="card-head"><h2 data-i18n="todayTasks">今日任务</h2><span class="tag" id="todayCount"></span></div>
      <div class="task-list" id="todayList"></div>
    </section>

    <!-- 趋势 -->
    <section class="card span3" id="cardTrend">
      <div class="card-head"><h2 data-i18n="trend">Token 趋势（近 180 天）</h2></div>
      <div class="legend" id="trendLegend"></div>
      <canvas id="area" height="240"></canvas>
    </section>

    <!-- 热力图 -->
    <section class="card span3" id="cardHeat">
      <div class="card-head"><h2 data-i18n="heatmap">每日活跃热力图</h2></div>
      <canvas id="heat" height="160"></canvas>
    </section>

    <!-- 成就 · 连击 -->
    <section class="card span2" id="cardAchieve">
      <div class="card-head"><h2 data-i18n="achieve">成就 · 连击</h2><span class="tag" id="achCount">0/0</span></div>
      <div class="ach-wrap">
        <div class="streak-box" id="streakBox"></div>
        <div class="badge-grid" id="badgeGrid"></div>
      </div>
    </section>

    <!-- AI 生物钟 -->
    <section class="card" id="cardClock">
      <div class="card-head"><h2 data-i18n="bioclock">AI 生物钟</h2></div>
      <canvas id="clock"></canvas>
      <div class="clock-type" id="clockType"></div>
      <div class="clock-peak" id="clockPeak"></div>
    </section>

    <!-- 模型排行 -->
    <section class="card" id="cardModels">
      <div class="card-head"><h2 data-i18n="modelRank">模型排行</h2></div>
      <div class="rank" id="modelRank"></div>
    </section>

    <!-- 项目排行 -->
    <section class="card" id="cardProjects">
      <div class="card-head"><h2 data-i18n="projectRank">项目排行</h2></div>
      <div class="rank" id="projectRank"></div>
    </section>

    <!-- AI 战报 -->
    <section class="card" id="cardWeekly">
      <div class="card-head"><h2 data-i18n="weekly">AI 战报</h2></div>
      <div class="weekly-preview" id="weeklyPreview"></div>
      <button class="btn wide" id="btnPoster">生成本周战报</button>
    </section>

    <!-- 近期任务 -->
    <section class="card span2" id="cardRecent">
      <div class="card-head"><h2 data-i18n="recentTasks">近期任务</h2></div>
      <div class="task-list" id="recentList"></div>
    </section>
  </main>

  <!-- 战报海报弹窗 -->
  <div class="poster-modal" id="posterModal" hidden>
    <div class="poster-box">
      <canvas id="poster"></canvas>
      <div class="poster-actions">
        <button class="btn" id="btnPosterSave">保存图片</button>
        <button class="btn" id="btnPosterClose">关闭</button>
      </div>
    </div>

  let LATEST = null; // 最近一次完整数据（周报用）

  // ---------- 设置 ----------
  async function loadSettings() {
    try {
      const s = await fetch('/api/settings').then((r) => r.json());
      if (s && typeof s === 'object') {
        if (s.theme) document.documentElement.dataset.theme = s.theme;
        if (s.appearance) document.documentElement.dataset.appearance = s.appearance;
        if (s.lang) LANG = s.lang;
      }
    } catch (e) {}
    syncControls();
  }
  function syncControls() {
    document.getElementById('themeSel').value = document.documentElement.dataset.theme;
    document.getElementById('btnAppearance').textContent =
      document.documentElement.dataset.appearance === 'dark' ? '☀️' : '🌙';
    applyI18n();
  }
  function persist() {
    fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        theme: document.documentElement.dataset.theme,
        appearance: document.documentElement.dataset.appearance,
        lang: LANG,
      }),
    }).catch(() => {});
  }

  function applyI18n() {
    document.documentElement.lang = LANG;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const k = el.getAttribute('data-i18n');
      el.textContent = t(k);
    });

  // ---------- 颜色工具 ----------
  function getColors(n) {
    const v = (name, fb) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fb;
    const base = [v('--accent', '#0ea5a4'), v('--accent2', '#3b82f6'), v('--accent3', '#8b5cf6'), v('--accent4', '#f59e0b')];
    const out = base.slice();
    let i = 0;
    while (out.length < n) {
      const hue = (i * 47 + 200) % 360;
      out.push(`hsl(${hue},65%,58%)`);
      i++;
    }
    return out;
  }

  // ---------- 渲染 ----------
  function fmt(n) {
    if (n == null) return '0';
    if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return String(Math.round(n));
  }

  // 金额格式化：千分位 + 两位小数，避免用 K/M/B 缩写造成单位歧义
  function fmtMoney(n, decimals) {
    if (n == null || isNaN(n)) return '0';
    const d = decimals == null ? 2 : decimals;
    const neg = Number(n) < 0;
    const fixed = Math.abs(Number(n)).toFixed(d);
    const [int, frac] = fixed.split('.');
    const withSep = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + (frac != null ? withSep + '.' + frac : withSep);
  }

  // 额度预警条：任一窗口用量超阈值时置顶提醒
  const ALERT_THRESHOLD = 80;
  function renderAlert(quota) {
    const bar = document.getElementById('alertBar');
    if (!quota.windows.length) { bar.hidden = true; return; }
    const worst = quota.windows.slice().sort((a, b) => (b.usedPercent || 0) - (a.usedPercent || 0))[0];
    const pct = worst.usedPercent || 0;
    if (pct < ALERT_THRESHOLD) { bar.hidden = true; return; }
    bar.hidden = false;
    const level = pct >= 95 ? 'critical' : 'warn';
    bar.className = 'alert-bar ' + level;
    bar.innerHTML =
      '<span class="alert-icon">⚠</span>' +
      '<span class="alert-text">' +
      (LANG === 'zh'
        ? `<b>${worst.label}</b> 已用 <b>${Math.round(pct)}%</b>，额度即将耗尽${pct >= 95 ? '，请留意！' : '，建议控制用量'}` +
          (worst.resetsAt && worst.resetsAt > Date.now() ? `（${t('reset')} ${new Date(worst.resetsAt).toLocaleString()}）` : '')
        : `<b>${worst.label}</b> at <b>${Math.round(pct)}%</b> — quota nearly exhausted` +
          (worst.resetsAt && worst.resetsAt > Date.now() ? ` (${t('reset')} ${new Date(worst.resetsAt).toLocaleString()})` : '')) +
      '</span>';
  }

  // 今日概览：今日 token / 花费 / 任务 / 项目，与昨日对比
  function renderToday(today) {
    if (!today) return;
    document.getElementById('todayDate').textContent = today.date;
    document.getElementById('todayTokens').textContent = fmt(today.tokens);
    document.getElementById('todayValue').textContent = '¥' + fmtMoney(today.cny);
    document.getElementById('todayTasksN').textContent = today.tasks;
    document.getElementById('todayProjects').textContent = today.projects;

    const deltaTokens = document.getElementById('todayTokensDelta');
    const deltaValue = document.getElementById('todayValueDelta');
    const diffTokens = today.tokens - today.yesterdayTokens;
    const diffUsd = today.usd - today.yesterdayUsd;
    const diffPctT = today.yesterdayTokens > 0 ? (diffTokens / today.yesterdayTokens) * 100 : null;
    const diffPctU = today.yesterdayUsd > 0 ? (diffUsd / today.yesterdayUsd) * 100 : null;

    const arrow = (v) => (v > 0 ? '▲' : v < 0 ? '▼' : '—');
    const cls = (v) => (v > 0 ? 'up' : v < 0 ? 'down' : 'flat');
    if (diffPctT == null) {
      deltaTokens.textContent = t('vsYest') + ' ' + t('noData');
      deltaTokens.className = 'delta flat';
    } else {
      deltaTokens.textContent = `${t('vsYest')} ${arrow(diffTokens)} ${Math.abs(diffPctT).toFixed(0)}%`;
      deltaTokens.className = 'delta ' + cls(diffTokens);
    }
    if (diffPctU == null) {
      deltaValue.textContent = t('vsYest') + ' ' + t('noData');
      deltaValue.className = 'delta flat';
    } else {
      deltaValue.textContent = `${t('vsYest')} ${arrow(diffUsd)} ${Math.abs(diffPctU).toFixed(0)}%`;
      deltaValue.className = 'delta ' + cls(diffUsd);
    }
    document.getElementById('todayProjectsN').textContent = today.tasks;
    document.getElementById('todayAvg').textContent =
      `${t('avgPer')} ${fmt(today.tasks ? today.tokens / today.tasks : 0)}`;
  }

  // ---------- 原创玩法：成就 / 生物钟 / 战报 / 燃烧倒计时 ----------
  function fmtDur(ms) {
    if (ms <= 0) return '0m';
    const mins = Math.floor(ms / 60000);
    const dd = Math.floor(mins / 1440), hh = Math.floor((mins % 1440) / 60), mm = mins % 60;
    if (dd > 0) return `${dd}d ${hh}h`;
    if (hh > 0) return `${hh}h ${mm}m`;
    return `${mm}m`;
  }

  // 燃烧倒计时：每秒刷新所有带 data-at 的 .burn-line
  let burnTimer = null;
  function tickBurn() {
    document.querySelectorAll('.burn-line').forEach((el) => {
      const at = Number(el.dataset.at);
      if (!at) return;
      const diff = at - Date.now();
      if (diff <= 0) {
        el.textContent = '⚠ ' + t('burnExhausted');
        el.classList.add('hot');
      } else {
        el.textContent =
          '⏳ ' + t('burnEmpty') + ' ' + fmtDur(diff) + (el.dataset.safe === '1' ? ' · ' + t('burnSafe') : '');
        el.classList.toggle('hot', diff < 3600000);
      }
    });
  }
  function startBurnTicker() {
    if (!burnTimer) burnTimer = setInterval(tickBurn, 1000);
    tickBurn();
  }

  function burnLineFor(w) {
    const line = document.createElement('div');
    line.className = 'burn-line';
    const b = w.burn;
    if (!b) { line.textContent = ''; return line; }
    if (b.exhausted) {
      line.textContent = '⚠ ' + t('burnExhausted');
      line.classList.add('hot');
    } else if (b.depletedAt) {
      line.dataset.at = b.depletedAt;
      line.dataset.safe = b.beforeReset ? '0' : '1';
    } else {
      line.textContent = '⏱ ' + t('burnWait');
      line.classList.add('dim');
    }
    return line;
  }

  // 首次加载静默同步解锁记录，之后新解锁才触发庆祝
  let achInited = false;
  function celebrateNew(achievements) {
    let seen = [];
    try { seen = JSON.parse(localStorage.getItem('cuw_unlocked') || '[]'); } catch (e) {}
    const ids = achievements.filter((a) => a.unlocked).map((a) => a.id);
    const fresh = ids.filter((id) => seen.indexOf(id) === -1);
    try { localStorage.setItem('cuw_unlocked', JSON.stringify(ids)); } catch (e) {}
    if (!achInited) { achInited = true; return; }
    fresh.forEach((id, i) => setTimeout(() => toastAchievement(id, achievements), i * 900));
  }

  function toastAchievement(id, achievements) {
    const a = achievements.find((x) => x.id === id);
    if (!a) return;
    const pair = (ACH_TEXT[LANG] || ACH_TEXT.zh)[id] || [id, ''];
    const el = document.createElement('div');
    el.className = 'ach-toast';
    el.innerHTML =
      `<span class="a-icon">${a.icon}</span>` +
      `<div class="a-txt"><div class="a-k">${t('unlockedToast')}</div>` +
      `<div class="a-name">${escapeHtml(pair[0])}</div>` +
      `<div class="a-desc">${escapeHtml(pair[1])}</div></div>`;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    confettiBurst();
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, 4200);
    const badge = document.querySelector(`.badge[data-ach="${id}"]`);
    if (badge) badge.classList.add('pop');
  }

  function confettiBurst() {
    const colors = getColors(6);
    const box = document.createElement('div');
    box.className = 'confetti';
    for (let i = 0; i < 36; i++) {
      const p = document.createElement('i');
      p.style.left = 50 + (Math.random() * 40 - 20) + 'vw';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', Math.random() * 320 - 160 + 'px');
      p.style.setProperty('--rot', Math.random() * 720 - 360 + 'deg');
      p.style.animationDelay = Math.random() * 0.25 + 's';
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 2800);
  }

  // ----- AI 战报（周报海报） -----
  function weekStats() {
    const d = LATEST;
    if (!d) return null;
    const last7 = d.trends.daily.slice(-7);
    const tokens = last7.reduce((a, x) => a + x.tokens, 0);
    const activeDays = last7.filter((x) => x.tokens > 0).length;
    const since = Date.now() - 7 * 86400000;
    const tasks7 = d.tasks.recent.filter((x) => x.updatedAt >= since);
    const proj = {};
    tasks7.forEach((x) => { const p = x.project || '—'; proj[p] = (proj[p] || 0) + (x.tokensUsed || x.tokens || 0); });
    const topP = Object.entries(proj).sort((a, b) => b[1] - a[1])[0];
    const models = {};
    tasks7.forEach((x) => { models[x.model] = (models[x.model] || 0) + 1; });
    const topM = Object.entries(models).sort((a, b) => b[1] - a[1])[0];
    const weekUsd = d.tokens.total > 0 ? (d.value.usd * tokens) / d.tokens.total : 0;
    return {
      tokens, activeDays, sessions: tasks7.length,
      topProject: topP ? topP[0] : '—', topModel: topM ? topM[0] : '—',
      usd: weekUsd, range: [last7[0].date, last7[last7.length - 1].date],
    };
  }

  function weekTitleOf(tokens) {
    const arr = t('weekTitles');
    const idx = tokens >= 2e8 ? 4 : tokens >= 5e7 ? 3 : tokens >= 1e7 ? 2 : tokens >= 1e6 ? 1 : 0;
    return arr[idx];
  }

    document.getElementById('btnPosterSave').textContent = t('savePoster');
    document.getElementById('btnPosterClose').textContent = t('closePoster');
  }

        [labels[4], ws.topProject],

      ],
      footerLeft: t('posterFoot'),
      generatedText: new Date().toLocaleDateString(),
    });
    document.getElementById('posterModal').hidden = false;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  // ---------- 数据拉取 ----------
  async function refresh() {
    try {
      let d;
      if (window.__BOOTSTRAP__) {
        d = window.__BOOTSTRAP__;
        window.__BOOTSTRAP__ = null;
      } else {
        d = await fetch('/api/summary').then((r) => r.json());
      }
      renderAlert(d.quota);
      renderToday(d.today);
      renderQuota(d.quota);
      renderTokens(d.tokens, d.value);
      renderLeadership(d.leadership);
      renderTasks(d.tasks.today, d.tasks.recent);
      renderTrend(d.trends);
      renderHeat(d.trends.daily);
      renderRank(d.rankings.models, 'modelRank', 'tokens', (r) => fmt(r.tokens) + (r.usd ? ` · $${fmtMoney(r.usd)}` : ''));
      renderRank(d.rankings.projects, 'projectRank', 'tokens', (r) => fmt(r.tokens) + ` · ${r.sessions}${t('ses')}`);
      // 原创玩法模块
      LATEST = d;
      if (d.stats) {
        renderAchievements(d.stats);
        renderClock(d.stats.circadian);
      }
      renderWeekly();
      startBurnTicker();
      document.getElementById('updated').textContent = t('updated') + ' ' + new Date(d.generatedAt).toLocaleTimeString();
      document.getElementById('footMeta').textContent =
        `${d.sources.codex.threadCount} Codex ${LANG === 'zh' ? '会话' : 'threads'} · ${d.sources.claude.fileCount} Claude ${LANG === 'zh' ? '文件' : 'files'}`;
    } catch (e) {
      document.getElementById('updated').textContent = 'error: ' + e.message;
    }
  }

  // ---------- 事件 ----------
  document.getElementById('btnRefresh').onclick = () => refresh();
  document.getElementById('themeSel').onchange = (e) => {
    document.documentElement.dataset.theme = e.target.value;
    persist();
    refresh();
  };
  document.getElementById('btnAppearance').onclick = () => {
    const cur = document.documentElement.dataset.appearance;
    document.documentElement.dataset.appearance = cur === 'dark' ? 'light' : 'dark';
    syncControls();
    persist();
    refresh();
  };
  document.getElementById('btnLang').onclick = () => {
    LANG = LANG === 'zh' ? 'en' : 'zh';
    syncControls();
    persist();
    refresh();
  };
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 'U')) {
      e.preventDefault();
      refresh();
    }
    if (e.key === 'Escape') document.getElementById('posterModal').hidden = true;
  });

  // 战报海报
  document.getElementById('btnPoster').onclick = openPoster;
  document.getElementById('btnPosterClose').onclick = () => {
    document.getElementById('posterModal').hidden = true;
  };
  document.getElementById('posterModal').onclick = (e) => {
    if (e.target === e.currentTarget) e.currentTarget.hidden = true;
  };
  document.getElementById('btnPosterSave').onclick = () => {
    const cv = document.getElementById('poster');
    cv.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'codexU-weekly-' + new Date().toISOString().slice(0, 10) + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    });
  };

  // ---------- 启动 ----------
  (async function init() {
    await loadSettings();
    syncControls();
    await refresh();
    setInterval(refresh, 60000);
  })();
})();
</script>
</body>
</html>
